# Render Blueprint for Zensa API
# Place this file at the root of the repository that contains the zensa-api folder
# or adjust the rootDir if your structure differs.

services:
  - type: web
    name: zensa-api
    runtime: docker
    plan: free          # free tier (sleeps after ~15 min inactivity)
    region: frankfurt   # change if you prefer (oregon, singapore, etc.)
    branch: master      # or master
    rootDir: zensa-api/zensa-api   # path to the Gradle project (adjust if needed)
    dockerfilePath: Dockerfile
    envVars:
      - key: PORT
        value: 8080
      - key: JWT_SECRET
        generateValue: true        # Render will generate a secure random value
      - key: JWT_EXPIRATION_MS
        value: "86400000"
      - key: DB_URL
        sync: false                 # set manually after creating a database
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: GOOGLE_CLIENT_IDS
        sync: false                 # your Android OAuth client id (comma-separated if multiple)
      # Optional – leave empty to disable the features
      - key: AZURE_STORAGE_CONNECTION_STRING
        sync: false
      - key: COSMOS_ENDPOINT
        sync: false
      - key: COSMOS_KEY
        sync: false
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
    # healthCheckPath: /actuator/health   # uncomment only if you add spring-boot-starter-actuator
