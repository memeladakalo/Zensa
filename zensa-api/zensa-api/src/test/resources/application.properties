# Test-only settings: in-memory H2 database and a throw-away JWT secret.
# These are NOT real credentials and are never used outside automated tests.
spring.datasource.url=jdbc:h2:mem:zensa_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
zensa.jwt.secret=test-only-secret-key-at-least-32-characters-long
zensa.jwt.expiration-ms=3600000
