server.port=${PORT:8080}

# ---------------- Database (MySQL) ----------------
# Credentials come from environment variables - never commit real values.
#   DB_URL      e.g. jdbc:mysql://localhost:3306/zensa_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
#   DB_USERNAME e.g. zensa_user
#   DB_PASSWORD required (no default on purpose)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/zensa_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:zensa_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------- JPA ----------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ---------------- JWT ----------------
# JWT_SECRET is required and must be at least 32 characters (HS256).
# Generate one with:  openssl rand -base64 48
zensa.jwt.secret=${JWT_SECRET}
zensa.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---------------- SSO (Google, OAuth 2.0 / OpenID Connect) ----------------
# Comma-separated Google OAuth client ids allowed as the ID-token audience (the ANDROID client id).
# There is no client secret: the phone is a public client using PKCE.
zensa.google.client-ids=${GOOGLE_CLIENT_IDS:}

# ---------------- Push notifications (Firebase Cloud Messaging) ----------------
# Service-account key: paste the whole JSON into FIREBASE_CREDENTIALS_JSON (best for Azure App Service),
# or point FIREBASE_CREDENTIALS_PATH at the key file. Leave both empty to disable push.
zensa.firebase.credentials-json=${FIREBASE_CREDENTIALS_JSON:}
zensa.firebase.credentials-path=${FIREBASE_CREDENTIALS_PATH:}

# Daily deadline reminders (cron: sec min hour day month weekday)
zensa.reminders.enabled=${REMINDERS_ENABLED:true}
zensa.reminders.cron=${REMINDER_CRON:0 0 7 * * *}
zensa.reminders.zone=${REMINDER_ZONE:Africa/Johannesburg}

# ---------------- Azure Blob Storage (note attachments) ----------------
zensa.azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING:}
zensa.azure.storage.container=${AZURE_STORAGE_CONTAINER:zensa-user-files}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# ---------------- Azure Cosmos DB (NoSQL gamification profiles) ----------------
zensa.cosmos.endpoint=${COSMOS_ENDPOINT:}
zensa.cosmos.key=${COSMOS_KEY:}
zensa.cosmos.database=${COSMOS_DATABASE:zensa}
zensa.cosmos.container=${COSMOS_CONTAINER:gamification}
