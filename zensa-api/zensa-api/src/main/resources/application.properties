server.port=${PORT:8080}

# ---------------- Database (MySQL) ----------------
# Credentials come from environment variables - never commit real values.
#   DB_URL      e.g. jdbc:mysql://localhost:3306/zensa_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
#   DB_USERNAME e.g. zensa_user
#   DB_PASSWORD required (no default on purpose)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/zensa_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:zensa_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------- JPA ----------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ---------------- JWT ----------------
# JWT_SECRET is required and must be at least 32 characters (HS256).
# Generate one with:  openssl rand -base64 48
zensa.jwt.secret=${JWT_SECRET}
zensa.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---------------- Part 3: Azure Blob Storage (file attachments / note media) ----------------
# Set these env vars when deploying; leave empty for local MySQL-only mode.
azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING:}
azure.storage.container=${AZURE_STORAGE_CONTAINER:zensa-uploads}

# ---------------- Part 3: Azure Cosmos DB (optional document store for sync / analytics) ----------------
azure.cosmos.uri=${AZURE_COSMOS_URI:}
azure.cosmos.key=${AZURE_COSMOS_KEY:}
azure.cosmos.database=${AZURE_COSMOS_DATABASE:zensa}

# ---------------- Part 3: Google SSO ----------------
# Web client ID used to verify Google id tokens on /auth/sso
zensa.sso.google.client-id=${GOOGLE_SSO_CLIENT_ID:}

# ---------------- Part 3: Firebase (server-side push via Admin SDK) ----------------
# Path to service account JSON on the server host
firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH:}
